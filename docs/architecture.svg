<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" role="img" aria-labelledby="title desc">
  <title id="title">SkyLink architecture</title>
  <desc id="desc">PX4 connects through an unreliable UDP relay to the Python mission service, which serves the React ground station and SQLite flight log.</desc>
  <rect width="900" height="260" rx="16" fill="#071019"/>
  <g font-family="ui-monospace, monospace" text-anchor="middle">
    <g fill="#0d202c" stroke="#315267"><rect x="35" y="76" width="150" height="92" rx="6"/><rect x="250" y="76" width="150" height="92" rx="6"/><rect x="465" y="48" width="190" height="148" rx="6"/><rect x="720" y="24" width="145" height="82" rx="6"/><rect x="720" y="154" width="145" height="82" rx="6"/></g>
    <g fill="#e6f1f5" font-size="15" font-weight="700"><text x="110" y="112">PX4 SITL</text><text x="325" y="112">UDP RELAY</text><text x="560" y="91">MISSION SERVICE</text><text x="792" y="58">REACT UI</text><text x="792" y="188">SQLITE</text></g>
    <g fill="#7893a0" font-size="11"><text x="110" y="136">Gazebo x500</text><text x="325" y="136">loss · delay · dup</text><text x="560" y="117">MAVSDK · commands</text><text x="560" y="140">WebSocket · REST</text><text x="560" y="163">logging · replay</text><text x="792" y="82">Leaflet map</text><text x="792" y="212">flights · ACKs</text></g>
    <g stroke="#54d6ff" stroke-width="2" fill="none"><path d="M185 122h65"/><path d="M400 122h65"/><path d="M655 82h65"/><path d="M655 178h65"/></g>
    <g fill="#54d6ff"><path d="m244 117 8 5-8 5z"/><path d="m459 117 8 5-8 5z"/><path d="m714 77 8 5-8 5z"/><path d="m714 173 8 5-8 5z"/></g>
    <g fill="#f5b942" font-size="10"><text x="218" y="108">MAVLink</text><text x="432" y="108">UDP</text><text x="688" y="68">WS/API</text><text x="688" y="164">SQL</text></g>
  </g>
</svg>
